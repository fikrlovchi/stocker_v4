# stocker.uz — bitta domen, yo'llar bo'yicha.
#
#   /            → fikrlovchi-panel (admin), keyinchalik to'liq dastur
#   /pdf/        → uzumPDFs 4040 (yorliqlar), panel sessiyasi bilan qo'riqlanadi
#   /pack/       → stocker-server 4044 (yig'ish API + WebSocket)
#   /stocker.apk → operator ilovasi (statik fayl)
#
# Panel ATAYLAB ildizda: u havolalarni ildizdan yasaydi (`/login`,
# `/projects/...`, `/style.css`). Ildizda turgani uchun hech qanday BASE_PATH
# yoki sub_filter kerak emas — /panel/ ostiga qo'yilsa havolalar buzilardi.
#
# O'rnatish:
#   sudo cp deploy/nginx-stocker.uz.conf /etc/nginx/sites-available/stocker.uz
#   sudo ln -sf /etc/nginx/sites-available/stocker.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d stocker.uz -d www.stocker.uz --redirect
#
# DIQQAT: certbot 443 blokini SHU faylga qo'shadi. Keyinchalik faylni git'dan
# qayta nusxalasangiz TLS bloki yo'qoladi va sayt "Not secure" bo'lib qoladi
# (uzum.fikrlovchi.uz da bir marta shu bo'lgan). Tiklash: yuqoridagi certbot
# buyrug'ini qayta bajarish.
#
# WebSocket uchun /etc/nginx/nginx.conf dagi http { } blokida bir marta:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name stocker.uz www.stocker.uz;

    # Yig'ish API: telefon (Android) va desktop print client shu yerga keladi.
    # Bu blok `/` dan OLDIN turishi shart emas (nginx eng aniq mos keluvchi
    # prefiksni tanlaydi), lekin o'qishga qulay bo'lsin deb yuqorida.
    #
    # Oxiridagi `/` proxy_pass da muhim: /pack/api/scan → /api/scan bo'lib uzatiladi.
    location /pack/ {
        proxy_pass http://127.0.0.1:4044/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket ulanishi soatlab ochiq turadi (print client).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Yorliqlar (uzumPDFs). Bitta dastur ko'rinishi uchun ikkita shart:
    #   1) auth_request — kirish PANEL sessiyasi bilan tekshiriladi, shuning
    #      uchun uzumPDFs'ning o'z paroli so'ralmaydi (u yerda PANEL_AUTH=1).
    #   2) PUBLIC_BASE_URL=https://stocker.uz/pdf — chiquvchi PDF havolalari
    #      shu prefiks bilan yasalsin (uzumpdfs/.env).
    location /pdf/ {
        auth_request /internal/panel-session;
        error_page 401 = @panel_login;

        proxy_pass http://127.0.0.1:4040/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF yuklash/yasash uzoq ketishi mumkin.
        client_max_body_size 50m;
        proxy_read_timeout 300s;
    }

    # Trailing slash shart: /pdf da nisbiy yo'llar (fetch('history')) ildizga
    # ketib qolardi.
    location = /pdf { return 301 /pdf/; }

    # auth_request ichki so'rovi — panel faqat 200 yoki 401 qaytaradi.
    location = /internal/panel-session {
        internal;
        proxy_pass http://127.0.0.1:3000/internal/session-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Sessiya yo'q — panel'ning kirish sahifasiga.
    location @panel_login { return 302 /login; }

    # Yangi interfeys (React SPA). Hozircha `/app/` da: ildizda eski EJS panel
    # ishlab turibdi va bo'limlar ko'chib bo'lguncha o'chirilmaydi.
    # Yig'ish: cd /root/stocker/client && npm install && npm run build
    location /app/ {
        alias /root/stocker/client/dist/;
        # SPA yo'llari (masalan /app/users) serverda fayl emas — index.html
        # qaytariladi, marshrutni React hal qiladi.
        try_files $uri $uri/ /app/index.html;
    }

    # SPA'ning API'si. `/pack/` dan alohida: u yerda mobil API va WebSocket,
    # bu yerda veb sessiyasi va ruxsat tekshiruvi.
    location /web/ {
        proxy_pass http://127.0.0.1:4044/web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Operator ilovasi — telefonga shu manzildan yuklab olinadi.
    # Fayl: sudo cp stocker-0.4.0.apk /var/www/stocker/stocker.apk
    location = /stocker.apk {
        alias /var/www/stocker/stocker.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="stocker.apk"';
    }

    # Tanishtiruv sahifasi (web/landing/index.html) — ildiz panel bilan
    # band bo'lgani uchun shu yerda turadi. To'liq dastur tayyor bo'lganda
    # ildizga u chiqadi, panel esa /admin/ ga ko'chishi mumkin.
    location = /about {
        alias /var/www/stocker/index.html;
        default_type text/html;
    }

    # Admin panel — ildizda.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
