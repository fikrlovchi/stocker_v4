# stocker.uz — bitta domen, yo'llar bo'yicha bo'lingan.
#
#   /            → landing (statik, /var/www/stocker)
#   /pack/       → stocker-server 4044 (yig'ish API + WebSocket)
#   /panel/      → hozircha YO'Q, pastdagi izohga qarang
#
# O'rnatish:
#   sudo cp deploy/nginx-stocker.uz.conf /etc/nginx/sites-available/stocker.uz
#   sudo ln -s /etc/nginx/sites-available/stocker.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d stocker.uz -d www.stocker.uz --redirect
#
# DIQQAT: certbot 443 blokini SHU faylga qo'shadi. Keyinchalik faylni git'dan
# qayta nusxalasangiz TLS bloki yo'qoladi va sayt "Not secure" bo'lib qoladi
# (uzum.fikrlovchi.uz da bir marta shu bo'lgan). Tiklash: yuqoridagi certbot
# buyrug'ini qayta bajarish.
#
# WebSocket uchun /etc/nginx/nginx.conf dagi http { } blokida bir marta:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name stocker.uz www.stocker.uz;

    # Landing — statik sahifa, hech qanday Node kerak emas.
    root /var/www/stocker;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Yig'ish API: telefon (Android) va desktop print client shu yerga keladi.
    # Oxiridagi `/` proxy_pass da muhim: /pack/api/scan → /api/scan bo'lib uzatiladi.
    location /pack/ {
        proxy_pass http://127.0.0.1:4044/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket ulanishi soatlab ochiq turadi (print client).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- /panel/ hali ulanmagan ---
    #
    # fikrlovchi-panel havolalarini ildizdan boshlab yasaydi (`/login`,
    # `/projects/...`, `/style.css`). Uni shundoq /panel/ ostiga proxy qilsak,
    # sahifa ochiladi-yu, birinchi bosilgan havola /login ga ketib 404 beradi.
    #
    # To'g'ri yechim — panel'ga BASE_PATH qo'shish (barcha href/action va statik
    # yo'llar prefiks bilan), sukut bo'yicha bo'sh, shunda fikrlovchi.uz
    # o'zgarishsiz ishlaydi. Shundan keyin bu blok yoqiladi:
    #
    # location /panel/ {
    #     proxy_pass http://127.0.0.1:3000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    #
    # Shu paytgacha admin panel eski manzilda: https://fikrlovchi.uz

    # Telefonga APK'ni shu yerdan berish qulay (statik fayl).
    location = /stocker.apk {
        alias /var/www/stocker/stocker.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="stocker.apk"';
    }
}
