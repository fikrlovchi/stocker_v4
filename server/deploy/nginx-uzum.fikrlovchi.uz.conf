# uzum.fikrlovchi.uz
#   /        -> uzumPDFs dashboard (127.0.0.1:4040)
#   /pack/   -> stocker yig'ish API + WebSocket (127.0.0.1:4044)
#
# ⚠️ DIQQAT — bu faylni serverga NUSXALASHDAN OLDIN o'qing.
#
# certbot ishga tushgach /etc/nginx/sites-available/uzum.fikrlovchi.uz
# fayliga 443 (SSL) blokini va HTTP->HTTPS yo'naltirishni O'ZI qo'shadi.
# Shundan keyin serverdagi fayl bu repodagi nusxadan FARQ QILADI.
#
# Agar shu faylni ustidan qayta nusxalasangiz, SSL bloki YO'QOLADI va sayt
# "Not secure" bo'lib qoladi (bir marta shunday bo'lgan). Tiklash:
#
#   sudo certbot --nginx -d uzum.fikrlovchi.uz --redirect
#   # so'ralganda 1 — mavjud sertifikatni qayta o'rnatish
#
# Shuning uchun bu yerni o'zgartirsangiz, serverda faylni to'liq almashtirish
# o'rniga faqat kerakli location blokini qo'lda ko'chiring.
#
# BIRINCHI MARTA o'rnatish:
#   sudo cp server/deploy/nginx-uzum.fikrlovchi.uz.conf \
#           /etc/nginx/sites-available/uzum.fikrlovchi.uz
#   sudo ln -s /etc/nginx/sites-available/uzum.fikrlovchi.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d uzum.fikrlovchi.uz --redirect

# WebSocket uchun. Nom ataylab noyob ("$connection_upgrade" emas) — boshqa
# sayt konfiguratsiyalari bilan to'qnashmasin.
map $http_upgrade $stocker_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name uzum.fikrlovchi.uz;

    # uzumPDFs: dashboard, /files/*, /internal/* (internal'ni tashqaridan
    # yopish uchun pastdagi blokka qarang)
    location / {
        proxy_pass http://127.0.0.1:4040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # uzumPDFs'ning ichki API'si faqat serverning o'zidan chaqiriladi
    # (stocker -> 127.0.0.1:4040). Tashqaridan kirish yopiladi: service
    # token bo'lsa ham ortiqcha yuza qoldirmaymiz.
    location /internal/ {
        deny all;
    }

    # stocker: mobil ilova API'si, desktop client WebSocket'i va PDF'lar
    location /pack/ {
        proxy_pass http://127.0.0.1:4044/;

        # WebSocket (desktop print client)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $stocker_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ulanish uzoq turadi — standart 60 s yetmaydi.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
